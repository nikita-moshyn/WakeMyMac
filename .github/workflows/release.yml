name: Release WakeMyMac

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to add or repair Homebrew bottles (for example v2.1.0)
        required: true
        type: string

permissions:
  contents: write

# Formula updates must follow the corresponding asset uploads in order.
concurrency:
  group: wakemymac-release
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: '1'
  HOMEBREW_NO_ANALYTICS: '1'
  HOMEBREW_NO_INSTALL_CLEANUP: '1'
  HOMEBREW_NO_AUTOREMOVE: '1'

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Xcode for the release build
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build and package the tagged source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf '// This file is auto-generated by GitHub Actions\nlet appVersion = "%s"\n' "$VERSION" > WakeMyMac/Models/Version.swift

          for ARCH in x86_64 arm64; do
            xcodebuild -scheme WakeMyMac \
              -configuration Release \
              -derivedDataPath "build/$ARCH" \
              -arch "$ARCH" \
              MACOSX_DEPLOYMENT_TARGET=14.7 \
              CODE_SIGNING_ALLOWED=NO
          done

          mkdir -p release-input/staging
          lipo -create \
            build/x86_64/Build/Products/Release/WakeMyMac \
            build/arm64/Build/Products/Release/WakeMyMac \
            -output release-input/staging/WakeMyMac_universal
          for ARCH in x86_64 arm64; do
            lipo -verify_arch "$ARCH" release-input/staging/WakeMyMac_universal
          done
          chmod +x release-input/staging/WakeMyMac_universal
          codesign --force --sign - release-input/staging/WakeMyMac_universal
          release-input/staging/WakeMyMac_universal --version
          tar -czf "release-input/WakeMyMac_$VERSION.tar.gz" -C release-input/staging WakeMyMac_universal

      - uses: actions/upload-artifact@v4
        with:
          name: release-binary
          path: release-input/*.tar.gz
          if-no-files-found: error

  homebrew:
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: macos-15
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
      RELEASE_TAP: wakemymac/release-build
    steps:
      # Use current packaging scripts even when repairing an older release.
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - name: Validate the release tag and packaging scripts
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          /usr/bin/ruby scripts/test-homebrew-release.rb

      - name: Check whether this release already has a binary
        id: release
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            echo "No existing release found for $RELEASE_TAG" >&2
            exit 1
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.release.outputs.exists == 'false'
        with:
          name: release-binary
          path: release-input

      - name: Download the existing binary for a bottle repair
        if: steps.release.outputs.exists == 'true'
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "WakeMyMac_$VERSION.tar.gz" --dir release-input

      - name: Generate and install the formula for bottling
        run: |
          set -euo pipefail
          /usr/bin/ruby scripts/homebrew-release.rb \
            --version "$VERSION" --repository "$GITHUB_REPOSITORY" \
            --archive "release-input/WakeMyMac_$VERSION.tar.gz" \
            --previous-formula Formula/wakemymac.rb \
            --output Formula/wakemymac.rb
          brew tap-new --no-git "$RELEASE_TAP"
          TAP_DIR="$(brew --repository "$RELEASE_TAP")"
          cp Formula/wakemymac.rb "$TAP_DIR/Formula/wakemymac.rb"

          # Seed the verified source archive so a new release can be tested
          # completely before either its assets or formula are published.
          CACHE_FILE="$(brew --cache --formula --build-from-source "$RELEASE_TAP/wakemymac")"
          mkdir -p "$(dirname "$CACHE_FILE")"
          cp "release-input/WakeMyMac_$VERSION.tar.gz" "$CACHE_FILE"
          brew install --build-bottle "$RELEASE_TAP/wakemymac"
          brew test "$RELEASE_TAP/wakemymac"
          for ARCH in x86_64 arm64; do
            lipo -verify_arch "$ARCH" "$(brew --prefix "$RELEASE_TAP/wakemymac")/bin/wake"
          done

      - name: Create relocatable bottles for Intel and Apple Silicon
        run: |
          set -euo pipefail
          mkdir -p dist
          cd dist
          brew bottle --json --keep-old \
            --root-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG" \
            "$RELEASE_TAP/wakemymac"
          cd ..
          /usr/bin/ruby scripts/homebrew-release.rb \
            --version "$VERSION" --repository "$GITHUB_REPOSITORY" \
            --archive "release-input/WakeMyMac_$VERSION.tar.gz" \
            --bottle-json dist/*.bottle.json \
            --output Formula/wakemymac.rb

      - name: Verify installation without Xcode or Command Line Tools
        run: |
          set -euo pipefail
          brew uninstall "$RELEASE_TAP/wakemymac"
          cp Formula/wakemymac.rb "$(brew --repository "$RELEASE_TAP")/Formula/wakemymac.rb"
          CACHE_FILE="$(brew --cache --formula "$RELEASE_TAP/wakemymac")"
          mkdir -p "$(dirname "$CACHE_FILE")"
          cp dist/wakemymac-"$VERSION".arm64_sonoma.bottle*.tar.gz "$CACHE_FILE"
          brew ruby scripts/verify-homebrew-bottle.rb "$RELEASE_TAP/wakemymac"

      - name: Publish the release assets
        env:
          RELEASE_EXISTS: ${{ steps.release.outputs.exists }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_EXISTS" == true ]]; then
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              dist/wakemymac-"$VERSION".*.bottle*.tar.gz
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "$RELEASE_TAG" --generate-notes \
              "release-input/WakeMyMac_$VERSION.tar.gz" \
              dist/wakemymac-"$VERSION".*.bottle*.tar.gz
          fi

      - name: Update the tap after its bottles are available
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/wakemymac.rb
          if ! git diff --cached --quiet; then
            git commit -m "Publish Homebrew bottles for $RELEASE_TAG"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
