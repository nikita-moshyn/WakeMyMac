name: Release WakeMyMac

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Git tag to release or repair Homebrew bottles (for example v2.1.0)
        required: true
        type: string

permissions:
  contents: write

# Formula updates must follow the corresponding asset uploads in order.
concurrency:
  group: wakemymac-release
  cancel-in-progress: false
  queue: max

env:
  HOMEBREW_NO_AUTO_UPDATE: '1'
  HOMEBREW_NO_ANALYTICS: '1'
  HOMEBREW_NO_INSTALL_CLEANUP: '1'
  HOMEBREW_NO_AUTOREMOVE: '1'

jobs:
  prepare:
    runs-on: macos-15
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
    outputs:
      has_binary: ${{ steps.release.outputs.has_binary }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate release scripts
        run: |
          set -euo pipefail
          /usr/bin/ruby scripts/test-homebrew-release.rb
          /usr/bin/ruby scripts/test-release-workflow.rb

      - name: Inspect the release and its binary asset
        id: release
        run: |
          set -euo pipefail
          /usr/bin/ruby scripts/release-state.rb \
            --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY" \
            --event "$GITHUB_EVENT_NAME" --output release-assets.json >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.has_binary != 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - name: Set up Xcode for the release build
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build and package the tagged source
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf '// This file is auto-generated by GitHub Actions\nlet appVersion = "%s"\n' "$VERSION" > WakeMyMac/Models/Version.swift

          for ARCH in x86_64 arm64; do
            xcodebuild -scheme WakeMyMac \
              -configuration Release \
              -derivedDataPath "build/$ARCH" \
              -arch "$ARCH" \
              MACOSX_DEPLOYMENT_TARGET=14.7 \
              CODE_SIGNING_ALLOWED=NO
          done

          mkdir -p release-input/staging
          lipo -create \
            build/x86_64/Build/Products/Release/WakeMyMac \
            build/arm64/Build/Products/Release/WakeMyMac \
            -output release-input/staging/WakeMyMac_universal
          for ARCH in x86_64 arm64; do
            lipo release-input/staging/WakeMyMac_universal -verify_arch "$ARCH"
          done
          chmod +x release-input/staging/WakeMyMac_universal
          codesign --force --sign - release-input/staging/WakeMyMac_universal
          release-input/staging/WakeMyMac_universal --version
          tar -czf "release-input/WakeMyMac_$VERSION.tar.gz" -C release-input/staging WakeMyMac_universal

      - uses: actions/upload-artifact@v4
        with:
          name: release-binary
          path: release-input/*.tar.gz
          if-no-files-found: error

  homebrew:
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: macos-15
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
      RELEASE_TAP: wakemymac/release-build
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      # This job can be rerun without prepare, including after a successful tap
      # push. Start from the current formula and validate these scripts again.
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - name: Validate the current packaging scripts
        run: |
          set -euo pipefail
          /usr/bin/ruby scripts/test-homebrew-release.rb
          /usr/bin/ruby scripts/test-release-workflow.rb

      # Failed-job reruns reuse prepare's successful outputs. Inspect again so
      # partial uploads and rebuild numbers reflect the state at this attempt.
      - name: Refresh the release state
        id: release
        run: |
          set -euo pipefail
          /usr/bin/ruby scripts/release-state.rb \
            --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY" \
            --event "$GITHUB_EVENT_NAME" --output release-assets.json >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        if: steps.release.outputs.has_binary != 'true'
        with:
          name: release-binary
          path: release-input

      - name: Download the existing binary for a bottle repair
        if: steps.release.outputs.has_binary == 'true'
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "WakeMyMac_$VERSION.tar.gz" --dir release-input

      - name: Generate and install the formula for bottling
        run: |
          set -euo pipefail
          /usr/bin/ruby scripts/homebrew-release.rb \
            --version "$VERSION" --repository "$GITHUB_REPOSITORY" \
            --archive "release-input/WakeMyMac_$VERSION.tar.gz" \
            --previous-formula Formula/wakemymac.rb \
            --release-assets release-assets.json \
            --output Formula/wakemymac.rb
          brew tap-new --no-git "$RELEASE_TAP"
          TAP_DIR="$(brew --repository "$RELEASE_TAP")"
          cp Formula/wakemymac.rb "$TAP_DIR/Formula/wakemymac.rb"

          # Seed the verified source archive so a new release can be tested
          # completely before either its assets or formula are published.
          CACHE_FILE="$(brew --cache --formula --build-from-source "$RELEASE_TAP/wakemymac")"
          mkdir -p "$(dirname "$CACHE_FILE")"
          cp "release-input/WakeMyMac_$VERSION.tar.gz" "$CACHE_FILE"
          brew install --build-bottle "$RELEASE_TAP/wakemymac"
          brew test "$RELEASE_TAP/wakemymac"
          for ARCH in x86_64 arm64; do
            lipo "$(brew --prefix "$RELEASE_TAP/wakemymac")/bin/wake" -verify_arch "$ARCH"
          done

      - name: Create relocatable bottles for Intel and Apple Silicon
        run: |
          set -euo pipefail
          mkdir -p dist
          cd dist
          brew bottle --json --keep-old \
            --root-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG" \
            "$RELEASE_TAP/wakemymac"
          cd ..
          /usr/bin/ruby scripts/homebrew-release.rb \
            --version "$VERSION" --repository "$GITHUB_REPOSITORY" \
            --archive "release-input/WakeMyMac_$VERSION.tar.gz" \
            --bottle-json dist/*.bottle.json \
            --output Formula/wakemymac.rb

      - name: Verify installation without Xcode or Command Line Tools
        run: |
          set -euo pipefail
          brew uninstall --formula --ignore-dependencies "$RELEASE_TAP/wakemymac"
          cp Formula/wakemymac.rb "$(brew --repository "$RELEASE_TAP")/Formula/wakemymac.rb"
          brew ruby scripts/verify-homebrew-bottle.rb "$RELEASE_TAP/wakemymac" dist

      - name: Publish the release assets
        env:
          RELEASE_EXISTS: ${{ steps.release.outputs.exists }}
          BINARY_EXISTS: ${{ steps.release.outputs.has_binary }}
          REPLACE_INCOMPLETE_BINARY: ${{ steps.release.outputs.replace_incomplete_binary }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_EXISTS" != true ]]; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "$RELEASE_TAG" --generate-notes --draft
          fi
          if [[ "$BINARY_EXISTS" != true ]]; then
            if [[ "$REPLACE_INCOMPLETE_BINARY" == true ]]; then
              gh release delete-asset "$RELEASE_TAG" "WakeMyMac_$VERSION.tar.gz" \
                --repo "$GITHUB_REPOSITORY" --yes
            fi
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              "release-input/WakeMyMac_$VERSION.tar.gz"
          fi
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            dist/wakemymac-"$VERSION".*.bottle*.tar.gz
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --verify-tag

      - name: Update the tap after its bottles are available
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/wakemymac.rb
          if ! git diff --cached --quiet; then
            git commit -m "Publish Homebrew bottles for $RELEASE_TAG"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
